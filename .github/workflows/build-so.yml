name: Compilar mame-native 0.139u1 (.so)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar dependencias de compilación
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential unzip wget python3 libstdc++6:i386 zlib1g:i386 libtinfo5

      - name: Instalar Android NDK r17c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r17c

      - name: Crear toolchains de Linux (ARM y ARM64)
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          python3 $NDK_PATH/build/tools/make_standalone_toolchain.py --arch arm --api 16 --install-dir $PWD/toolchain-arm
          python3 $NDK_PATH/build/tools/make_standalone_toolchain.py --arch arm64 --api 21 --install-dir $PWD/toolchain-arm64

      - name: Compilar herramientas auxiliares nativas (prec-build)
        run: |
          mkdir -p prec-build
          make -j$(nproc) TARGET=mame OSD=sdl NOWERROR=1 \
            CC="@gcc" LD="@g++" AR="@ar" \
            obj/sdl/mame/build/file2str obj/sdl/mame/build/png2bdc obj/sdl/mame/build/verinfo || true
          find obj -type f -executable -exec cp {} prec-build/ \;
          ls -la prec-build/

      - name: Compilar mame-native a .so (ARMv7 y ARM64)
        run: |
          # Compilar para 32-bit (armeabi-v7a)
          make -j$(nproc) TARGET=mame OSD=droid-ios \
            CC="@$PWD/toolchain-arm/bin/arm-linux-androideabi-clang" \
            LD="@$PWD/toolchain-arm/bin/arm-linux-androideabi-clang++" \
            AR="@$PWD/toolchain-arm/bin/arm-linux-androideabi-ar"

          # Limpiar objetos intermedios antes de compilar 64-bit
          make clean TARGET=mame OSD=droid-ios

          # Compilar para 64-bit (arm64-v8a)
          make -j$(nproc) TARGET=mame OSD=droid-ios PTR64=1 \
            CC="@$PWD/toolchain-arm64/bin/aarch64-linux-android-clang" \
            LD="@$PWD/toolchain-arm64/bin/aarch64-linux-android-clang++" \
            AR="@$PWD/toolchain-arm64/bin/aarch64-linux-android-ar"

      - name: Subir librerías .so compiladas
        uses: actions/upload-artifact@v4
        with:
          name: mame-native-so
          path: |
            **/*.so
