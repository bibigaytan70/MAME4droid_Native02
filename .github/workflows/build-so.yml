name: Compilar MAME4droid Native (.so)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar dependencias de compilación en Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev

      - name: Descargar e instalar Android NDK r16b
        run: |
          wget -O ndk.zip https://google.com
          unzip -q ndk.zip
          rm ndk.zip
          echo "NDK_ROOT=$PWD/android-ndk-r16b" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r16b" >> $GITHUB_PATH

      - name: Compilar herramientas host en prec-build
        run: |
          mkdir -p prec-build
          gcc -O2 -Isrc/osd -Isrc/lib/util src/emu/cpu/m68000/m68kmake.c -o prec-build/m68kmake
          gcc -O2 -Isrc/osd -Isrc/lib/util src/build/file2str.c -o prec-build/file2str
          gcc -O2 -Isrc/osd -Isrc/lib/util src/build/verinfo.c -o prec-build/verinfo || true
          ls -la prec-build

      - name: Compilar MAME4droid para Android (.so)
        run: |
          make -j$(nproc)

      - name: Empaquetar y subir archivos .so
        uses: actions/upload-artifact@v4
        with:
          name: librerias-mame4droid-so
          path: |
            **/*.so
