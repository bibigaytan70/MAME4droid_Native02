name: Compilar mame-native 0.139u1 (.so)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar dependencias de compilación
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential unzip wget libstdc++6:i386 zlib1g:i386

      - name: Instalar Android NDK r15c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r15c

      - name: Configurar variables de entorno NDK
        run: |
          echo "NDK=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_PATH

      - name: Compilar mame-native a .so
        run: |
          make -j$(nproc) TARGET=mame OSD=droid ARM64=1
          make -j$(nproc) TARGET=mame OSD=droid

      - name: Subir librerías .so compiladas
        uses: actions/upload-artifact@v4
        with:
          name: mame-native-so
          path: |
            **/*.so
