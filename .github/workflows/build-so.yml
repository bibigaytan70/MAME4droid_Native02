      - name: Compilar MAME4droid ARMv7 (armeabi-v7a)
        run: |
          ARM_AR=$(find /C/Android/toolchain-r17c-arm/bin -name "*-ar" | head -n 1)
          make AARMV7=1 AARMV8= AR="$ARM_AR" LDFLAGS="-shared -Wl,--allow-multiple-definition -L/C/Android/toolchain-r17c-arm/sysroot/usr/lib -llog -lOpenSLES -lgnustl_static -lsupc++ -lm -ldl -lc" -j$(nproc)
          mkdir -p salida_so/armeabi-v7a
          if [ -f mame ]; then cp mame salida_so/armeabi-v7a/libmame4droid.so; fi
          ls -lh salida_so/armeabi-v7a/

      - name: Limpiar objetos previos
        run: |
          rm -rf obj mame mame64

      - name: Compilar MAME4droid ARM64 (arm64-v8a)
        run: |
          ARM64_BIN=/C/Android/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin
          ARM64_SYS=/C/Android/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          make AARMV7= AARMV8=1 PTR64=1 \
            AR="$ARM64_BIN/aarch64-linux-android-ar" \
            LDFLAGS="--target=aarch64-linux-android21 --sysroot=$ARM64_SYS -fuse-ld=lld -shared -Wl,--allow-multiple-definition -L$ARM64_SYS/usr/lib/aarch64-linux-android/21 -L$ARM64_SYS/usr/lib/aarch64-linux-android -llog -lOpenSLES -lc++_shared -lc++ -lm -ldl -lc" -j$(nproc)
          mkdir -p salida_so/arm64-v8a
          if [ -f mame64 ]; then cp mame64 salida_so/arm64-v8a/libmame4droid.so; elif [ -f mame ]; then cp mame salida_so/arm64-v8a/libmame4droid.so; fi
          ls -lh salida_so/arm64-v8a/

      - name: Empaquetar y subir ambos .so (ARMv7 + ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: librerias-mame4droid-so
          path: salida_so/**/*.so
