name: Compilar MAME4droid Native (.so)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar dependencias de compilación en Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl1.2-dev libexpat1-dev zlib1g-dev

      - name: Descargar e instalar Android NDK r16b
        run: |
          wget -q https://google.com
          unzip -q android-ndk-r16b-linux-x86_64.zip
          echo "NDK_ROOT=$PWD/android-ndk-r16b" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r16b" >> $GITHUB_PATH

      - name: Compilar herramientas host (m68kmake, etc.)
        run: |
          mkdir -p prec-build
          make TARGET=mame OSD=sdl buildtools -j$(nproc) || true
          cp -f obj/sdl/mame/build/* prec-build/ 2>/dev/null || cp -f obj/droid-ios/mame/build/* prec-build/ 2>/dev/null || true

      - name: Compilar MAME4droid para Android (.so)
        run: |
          make -j$(nproc)

      - name: Empaquetar y subir archivos .so
        uses: actions/upload-artifact@v4
        with:
          name: librerias-mame4droid-so
          path: |
            **/*.so
